<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Fejlesztés alatt</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #644c3a;
    perspective: 500px;
}

/* Kocka konténer */
.cube {
    position: relative;
    width: 200px;
    height: 200px;
    transform-style: preserve-3d;
}

/* Oldalak */
.face {
    position: absolute;
    width: 200px;
    height: 200px;
    border: 2px solid #644c3f;
    /* border-radius: 1rem; */
}

/* 6 oldal pozicionálása */
.front  { transform: rotateY(0deg) translateZ(100px); }
.back   { transform: rotateY(180deg) translateZ(100px); }
.right  { transform: rotateY(90deg) translateZ(100px); }
.left   { transform: rotateY(-90deg) translateZ(100px); }
.top    { transform: rotateX(90deg) translateZ(100px); }
.bottom { transform: rotateX(-90deg) translateZ(100px); }
</style>

</head>

<body>

<div class="cube" id="cube">
    <div class="face front"><img src="images/logo.jpg" alt="" width="100%"></div>
    <div class="face back"><img src="images/logo.jpg" alt="" width="100%"></div>
    <div class="face right"><img src="images/logo.jpg" alt="" width="100%"></div>
    <div class="face left"><img src="images/logo.jpg" alt="" width="100%"></div>
    <div class="face top"><img src="images/logo.jpg" alt="" width="100%"></div>
    <div class="face bottom"><img src="images/logo.jpg" alt="" width="100%"></div>
</div>

<script>
const cube = document.getElementById('cube');

let x = 0;
let y = 0;

function animate() {
    x += 0.5;
    y += 0.7;

    cube.style.transform = `rotateX(${x}deg) rotateY(${y}deg)`;

    requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
